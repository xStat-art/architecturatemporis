<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ATRC · GPS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .logo {
    font-size: 10px;
    letter-spacing: 3px;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 48px;
  }

  .logo span { color: #c55a11; }

  .lang-toggle {
    position: fixed;
    top: 14px; right: 14px;
    display: flex; gap: 4px;
    z-index: 50;
  }
  .lang-toggle-btn {
    font-family: Arial, sans-serif;
    font-size: 10px; font-weight: bold; letter-spacing: 1px;
    color: #555;
    background: transparent;
    border: 1px solid #2e2e2e;
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lang-toggle-btn.active { color: #fff; background: #1a1a1a; border-color: #555; }

  .status {
    font-size: 11px;
    letter-spacing: 2px;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 24px;
    min-height: 16px;
  }

  .coords-box {
    background: #1a1a1a;
    border: 1px solid #2e2e2e;
    padding: 32px 24px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 20px;
    position: relative;
  }

  .coords-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: #555;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .coords-value {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.3;
    word-break: break-all;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .coords-value.loading { color: #333; font-size: 14px; font-weight: 400; letter-spacing: 2px; }
  .coords-value.error   { color: #c00000; font-size: 13px; font-weight: 400; }

  .accuracy {
    font-size: 10px;
    color: #444;
    letter-spacing: 1px;
    margin-top: 12px;
    min-height: 14px;
  }

  .btn-copy {
    width: 100%;
    max-width: 340px;
    padding: 18px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: 1px solid #333;
    background: transparent;
    color: #888;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }

  .btn-copy:active,
  .btn-copy.copied {
    background: #c55a11;
    border-color: #c55a11;
    color: #fff;
  }

  .btn-copy:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .btn-refresh {
    width: 100%;
    max-width: 340px;
    padding: 14px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid #222;
    background: transparent;
    color: #444;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 48px;
  }

  .btn-refresh:active { color: #888; border-color: #444; }

  .instruction {
    font-size: 11px;
    color: #333;
    line-height: 1.8;
    max-width: 280px;
    letter-spacing: 0.3px;
  }

  .instruction strong { color: #555; }

  .form-link {
    margin-top: 32px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #333;
    text-decoration: none;
    text-transform: uppercase;
    border-bottom: 1px solid #222;
    padding-bottom: 2px;
    transition: color 0.2s;
  }

  .form-link:active { color: #c55a11; border-color: #c55a11; }

  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #c55a11;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.3; transform:scale(0.8); }
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button type="button" class="lang-toggle-btn" data-lang="en" data-i18n="lang.toggle.en">EN</button>
  <button type="button" class="lang-toggle-btn" data-lang="sr" data-i18n="lang.toggle.sr">SR</button>
</div>

<div class="logo">AT<span>RC</span> · GPS Locator</div>

<div class="status" id="status">
  <span class="dot"></span><span id="statusText"></span>
</div>

<div class="coords-box">
  <div class="coords-label" data-i18n="gps.coordsLabel">GPS Coordinates</div>
  <div class="coords-value loading" id="coords" data-i18n="gps.coords.waiting">Waiting for GPS...</div>
  <div class="accuracy" id="accuracy"></div>
</div>

<button class="btn-copy" id="btnCopy" onclick="copyCoords()" disabled data-i18n="gps.btnCopy">
  📋 &nbsp; Copy Coordinates
</button>

<button class="btn-refresh" onclick="getLocation()" data-i18n="gps.btnRefresh">
  ↻ &nbsp; Refresh
</button>

<div class="instruction">
  <strong data-i18n="gps.instruction.title">How to use:</strong><br>
  1. <span data-i18n="gps.instruction.step1">Copy coordinates above</span><br>
  2. <span data-i18n="gps.instruction.step2">Open the ATRC form</span><br>
  3. <span data-i18n="gps.instruction.step3pre">Paste into </span><strong data-i18n="gps.instruction.step3strong">GPS coordinates</strong><span data-i18n="gps.instruction.step3post"> field</span>
</div>

<a class="form-link" href="https://forms.gle/B29DyntFByrk24xD8" target="_blank" data-i18n="gps.formLink">
  → Open ATRC Field Form
</a>

<script src="i18n.js?v=20260819"></script>
<script>
let currentCoords = null;

// Icon (pulsing dot / check / cross) is managed separately from the
// translated text — the original swapped the whole innerHTML including
// the icon, so this keeps that behaviour while letting the text itself
// come from t(). lastGpsStatus is cached so a language switch mid-session
// can re-render whatever's currently showing, same pattern as field.html.
let lastGpsStatus = { icon: 'dot', key: 'gps.status.requesting', color: '' };

function setGpsStatus(icon, key, color) {
  lastGpsStatus = { icon: icon, key: key, color: color || '' };
  const statusEl = document.getElementById('status');
  const iconHtml = icon === 'dot' ? '<span class="dot"></span>' : (icon === 'check' ? '\u2713 &nbsp;' : '\u2715 &nbsp;');
  statusEl.innerHTML = iconHtml + '<span id="statusText">' + t(key) + '</span>';
  statusEl.style.color = color || '';
}

// coords/error display also alternates between raw DATA (coordinates —
// never translated) and translated prose (waiting/error messages) — same
// two-kind-of-content split as field.html's gpsValue, and for the same
// reason: language switch needs to know which kind is currently showing.
let coordsState = { type: 'waiting' }; // 'waiting' | 'coords' | 'error'

function renderCoordsWaiting() {
  coordsState = { type: 'waiting' };
  const el = document.getElementById('coords');
  el.className = 'coords-value loading';
  el.textContent = t('gps.coords.waiting');
}
function renderCoordsValue(text) {
  coordsState = { type: 'coords', text: text };
  const el = document.getElementById('coords');
  el.className = 'coords-value';
  el.textContent = text;
}
function renderCoordsError(key) {
  coordsState = { type: 'error', key: key };
  const el = document.getElementById('coords');
  el.className = 'coords-value error';
  el.textContent = t(key);
}

function getLocation() {
  setGpsStatus('dot', 'gps.status.requesting');
  renderCoordsWaiting();
  document.getElementById('accuracy').textContent = '';
  document.getElementById('btnCopy').disabled = true;

  if (!navigator.geolocation) {
    showError('gps.err.notSupported');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      const acc = Math.round(pos.coords.accuracy);

      currentCoords = `${lat}, ${lng}`;

      renderCoordsValue(currentCoords);
      document.getElementById('accuracy').textContent = t('gps.accuracy', { acc: acc });
      document.getElementById('btnCopy').disabled = false;
      setGpsStatus('check', 'gps.status.found', '#4CAF50');
    },
    function(err) {
      let msgKey = 'gps.err.generic';
      if (err.code === 1) msgKey = 'gps.err.permission';
      if (err.code === 2) msgKey = 'gps.err.unavailable';
      if (err.code === 3) msgKey = 'gps.err.timeout';
      showError(msgKey);
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

function showError(msgKey) {
  renderCoordsError(msgKey);
  setGpsStatus('cross', 'gps.status.error', '#c00000');
}

function copyCoords() {
  if (!currentCoords) return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(currentCoords).then(() => {
      showCopied();
    }).catch(() => fallbackCopy());
  } else {
    fallbackCopy();
  }
}

function fallbackCopy() {
  const el = document.createElement('textarea');
  el.value = currentCoords;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
  showCopied();
}

function showCopied() {
  const btn = document.getElementById('btnCopy');
  btn.textContent = t('gps.btnCopied');
  btn.classList.add('copied');
  setTimeout(() => {
    btn.innerHTML = t('gps.btnCopy');
    btn.classList.remove('copied');
  }, 2000);
}

// Auto-start
getLocation();

// Same reasoning as field.html: a language switch mid-session should
// update whatever's already on screen (status, coords placeholder/error),
// not just the next GPS update.
document.addEventListener('atrc:langchange', function() {
  setGpsStatus(lastGpsStatus.icon, lastGpsStatus.key, lastGpsStatus.color);
  if (coordsState.type === 'waiting') renderCoordsWaiting();
  else if (coordsState.type === 'error') renderCoordsError(coordsState.key);
  // 'coords' type needs no action — it's raw data, not translated
});
</script>
</body>
</html>
